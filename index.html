<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>หลงเปา</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fff5ea">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        /* --- ธีมตรุษจีน (สีแดง-ทอง-ครีม) --- */
        :root {
            --bg-body: #fdf5e6; 
            --bg-container: #fffcf5;
            --text-main: #a61a1a; 
            --text-gold: #d4af37;
            --text-muted: #5a2e1c;
            
            --table-border: #d4af37; 
            --table-cell-border: #f0e0b0;
            --table-bg: #fffdf9;
            --th-bg: #a61a1a; 
            
            --input-border: #e0c88f;
            --input-bg: #ffffff;
            --input-text: #5a2e1c;
            
            --btn-red-start: #ba1c1c;
            --btn-red-end: #8a0d0d;
            --btn-gold-start: #fde49d;
            --btn-gold-end: #d6ad44;
            
            --switch-bg: #a61a1a;
            --switch-btn: #fde49d;

            /* สีสำหรับ % กำไร */
            --color-profit: #2e7d32;   /* เขียว */
            --color-warning: #e65100;  /* ส้ม */
            --color-loss: #c62828;     /* แดง */
            --chart-bg: #f0e0b0;
        }

        /* --- โหมดกลางคืน (โทนแดงมืด-ทอง) --- */
        body.dark {
            --bg-body: #1a0505;
            --bg-container: #260a0a;
            --text-main: #fde49d;
            --text-muted: #e0d0c0;
            --table-border: #a67c27;
            --table-cell-border: #4a1c1c;
            --table-bg: #1c0606;
            --th-bg: #5c0f0f;
            --input-border: #8a6d23;
            --input-bg: #140303;
            --input-text: #fde49d;
            
            --btn-red-start: #7a1212;
            --btn-red-end: #4a0505;
            --btn-gold-start: #b08d2b;
            --btn-gold-end: #755b17;

            --switch-bg: #4a0505;
            --switch-btn: #fde49d;
            --chart-bg: #4a2525;

            /* สีสำหรับ % กำไร ในโหมดมืดให้สว่างขึ้น */
            --color-profit: #4caf50;   
            --color-warning: #ff9800;  
            --color-loss: #ef5350;     
        }

        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: var(--bg-body);
            
            /* ลวดลายจีน (Chinese Geometric Pattern) เป็น Background */
            background-image: 
                linear-gradient(30deg, rgba(212, 175, 55, 0.05) 12%, transparent 12.5%, transparent 87%, rgba(212, 175, 55, 0.05) 87.5%, rgba(212, 175, 55, 0.05)),
                linear-gradient(150deg, rgba(212, 175, 55, 0.05) 12%, transparent 12.5%, transparent 87%, rgba(212, 175, 55, 0.05) 87.5%, rgba(212, 175, 55, 0.05)),
                linear-gradient(30deg, rgba(212, 175, 55, 0.05) 12%, transparent 12.5%, transparent 87%, rgba(212, 175, 55, 0.05) 87.5%, rgba(212, 175, 55, 0.05)),
                linear-gradient(150deg, rgba(212, 175, 55, 0.05) 12%, transparent 12.5%, transparent 87%, rgba(212, 175, 55, 0.05) 87.5%, rgba(212, 175, 55, 0.05)),
                linear-gradient(60deg, rgba(166, 26, 26, 0.03) 25%, transparent 25.5%, transparent 75%, rgba(166, 26, 26, 0.03) 75%, rgba(166, 26, 26, 0.03)), 
                linear-gradient(60deg, rgba(166, 26, 26, 0.03) 25%, transparent 25.5%, transparent 75%, rgba(166, 26, 26, 0.03) 75%, rgba(166, 26, 26, 0.03));
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
            
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* ของตกแต่งฉากหลัง (กิ่งเหมย & โคมไฟ) */
        .decor-top-left {
            position: absolute; top: -10px; left: -10px;
            font-size: 100px; opacity: 0.15; transform: rotate(15deg);
            pointer-events: none; z-index: 0;
        }
        .decor-top-right {
            position: absolute; top: -20px; right: 10px;
            font-size: 80px; opacity: 0.1;
            pointer-events: none; z-index: 0;
        }
        .decor-bottom {
            position: absolute; bottom: -30px; right: -20px;
            font-size: 120px; opacity: 0.15; transform: rotate(-20deg);
            pointer-events: none; z-index: 0;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px; 
            background-color: var(--bg-container);
            padding: 25px 20px;
            border-radius: 20px;
            box-sizing: border-box;
            border: 2px solid var(--table-border);
            box-shadow: 0 10px 30px rgba(166, 26, 26, 0.15), inset 0 0 20px rgba(212, 175, 55, 0.1);
            z-index: 1;
        }

        /* --- กรอบมุมสไตล์สถาปัตยกรรมจีน (Container Corners) --- */
        .container::before, .container::after {
            content: ''; position: absolute; width: 40px; height: 40px; pointer-events: none;
        }
        .container::before {
            top: -2px; left: -2px;
            border-top: 4px solid var(--text-main); border-left: 4px solid var(--text-main);
            border-top-left-radius: 20px;
        }
        .container::after {
            bottom: -2px; right: -2px;
            border-bottom: 4px solid var(--text-main); border-right: 4px solid var(--text-main);
            border-bottom-right-radius: 20px;
        }

        /* --- สวิตช์โหมดมืด --- */
        .mode-toggle-container {
            position: absolute; top: 15px; right: 15px; z-index: 10;
        }
        .theme-switch { position: relative; display: inline-block; width: 54px; height: 28px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--switch-bg); border: 2px solid var(--switch-btn);
            transition: .4s; border-radius: 34px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 6px; box-sizing: border-box;
        }
        .slider i { font-size: 11px; z-index: 1; }
        .slider .fa-sun { color: #fff; }
        .slider .fa-moon { color: #fff; }
        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px; left: 4px; bottom: 3px;
            background-color: var(--switch-btn);
            transition: .4s; border-radius: 50%; z-index: 2;
        }
        input:checked + .slider:before { transform: translateX(24px); }

        /* --- หัวข้อ --- */
        .header-title {
            font-size: 26px; font-weight: 700;
            color: var(--text-main); text-align: center;
            margin-top: 25px; margin-bottom: 5px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }
        body.dark .header-title { text-shadow: 1px 1px 0px rgba(0,0,0,0.8); }

        .warning-text {
            font-size: 15px; color: var(--text-main);
            text-align: center; font-weight: 500; margin-bottom: 30px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }

        /* --- กล่องชื่อสินค้า --- */
        .product-name-container {
            width: 100%; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .product-label {
            font-size: 16px; font-weight: 700; color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
        }

        input {
            width: 100%; box-sizing: border-box; padding: 12px 15px;
            border: 1px solid var(--input-border); border-radius: 12px; 
            text-align: center; font-size: 15px; font-family: inherit; font-weight: 500;
            color: var(--input-text); outline: none; background-color: var(--input-bg);
            transition: all 0.3s ease;
        }
        input:focus { border-color: var(--text-main); box-shadow: 0 0 0 3px rgba(166, 26, 26, 0.1); }
        .product-name-container input {
            text-align: left;
            border: 1px solid var(--table-border);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
        }

        /* --- ตาราง (ดีไซน์กรอบจีน) --- */
        .chinese-table-wrapper {
            position: relative; margin-bottom: 25px;
            border-radius: 12px; overflow: hidden;
            border: 1px solid var(--table-border);
            box-shadow: 0 4px 10px rgba(166, 26, 26, 0.08);
            background-color: var(--table-bg);
        }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }

        th, td {
            border: 1px solid var(--table-cell-border);
            padding: 12px 4px; text-align: center;
            color: var(--text-muted); font-size: 14px;
            vertical-align: middle; word-wrap: break-word;
        }
        
        th { 
            font-weight: 600; font-size: 13px; 
            background-color: var(--th-bg);
            color: #fde49d; /* สีทอง */
            border-bottom: 2px solid var(--table-border);
        }

        .corner-tl, .corner-tr {
            position: absolute; top: 4px; width: 12px; height: 12px; pointer-events: none;
        }
        .corner-tl {
            left: 4px; border-top: 2px solid var(--text-gold); border-left: 2px solid var(--text-gold);
        }
        .corner-tr {
            right: 4px; border-top: 2px solid var(--text-gold); border-right: 2px solid var(--text-gold);
        }

        .bg-result-normal { background-color: var(--table-bg) !important; font-weight: bold;}
        .hidden-row { display: none !important; }

        /* --- กราฟวงกลม (โดนัท) --- */
        .chart-container {
            display: inline-flex; justify-content: center; align-items: center;
            position: relative; width: 50px; height: 50px; margin: auto;
        }
        .donut-bg { fill: none; stroke: var(--chart-bg); stroke-width: 8; }
        .donut-ring {
            fill: none; stroke-width: 8;
            stroke-linecap: round; stroke-dasharray: 157; stroke-dashoffset: 157;
            transition: stroke-dashoffset 0.4s ease, stroke 0.3s;
            transform: rotate(-90deg); transform-origin: 35px 35px;
        }
        .chart-text {
            position: absolute; display: flex; flex-direction: column;
            justify-content: center; align-items: center; width: 100%;
        }
        .chart-number { font-size: 11px; font-weight: 700; transition: color 0.3s; }

        /* --- ปุ่มกด --- */
        .button-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            width: 100%; margin-bottom: 35px;
        }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 10px; border-radius: 25px; 
            font-size: 15px; cursor: pointer; font-weight: 600;
            box-shadow: 0 4px 8px rgba(166, 26, 26, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.5); 
            transition: transform 0.1s, filter 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn:hover { filter: brightness(1.1); }

        .btn-clear { background: linear-gradient(to bottom, var(--btn-red-start), var(--btn-red-end)); color: white; }
        .btn-save-data { background: linear-gradient(to bottom, var(--btn-gold-start), var(--btn-gold-end)); color: #5a2e1c; border: 1px solid #d4af37; }
        .btn-capture { background: linear-gradient(to bottom, var(--btn-red-start), var(--btn-red-end)); color: white; }
        .btn-excel { background: linear-gradient(to bottom, var(--btn-red-start), var(--btn-red-end)); color: white; }
        .btn-share { background: linear-gradient(to bottom, var(--btn-red-start), var(--btn-red-end)); color: white; grid-column: span 2; }

        .btn-delete {
            background: #cc2525; color: white; border: 1px solid #a61a1a;
            border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px;
        }

        /* --- ประวัติ --- */
        .history-section { margin-top: 10px; width: 100%; }
        .history-title { 
            font-size: 18px; font-weight: 700; color: var(--text-main); 
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px; 
        }
        
        .table-responsive {
            width: 100%; overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(166, 26, 26, 0.08);
            border: 1px solid var(--table-border);
        }
        
        .history-table {
            table-layout: auto; min-width: 650px; margin-bottom: 0; box-shadow: none; border: none;
        }
        .history-table th, .history-table td {
            white-space: nowrap; font-size: 13px; border-left: none; border-right: none;
        }
        .history-table th { background-color: var(--th-bg); color: #fde49d; }

        td input {
            border: 1px solid var(--input-border);
            border-radius: 20px; padding: 6px; width: 90%;
            background-color: var(--input-bg); color: var(--input-text);
        }
        td input:focus { border-color: var(--table-border); box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.3); }

        @media (max-width: 500px) {
            body { padding: 15px 10px; }
            .header-title { font-size: 24px; }
            th, td { padding: 8px 2px; font-size: 12px; }
            .btn { font-size: 14px; padding: 12px 10px; }
        }
    </style>
</head>
<body>

<div class="decor-top-left" data-html2canvas-ignore="true">🌸</div>
<div class="decor-top-right" data-html2canvas-ignore="true">🏮</div>
<div class="decor-bottom" data-html2canvas-ignore="true">🌸</div>

<div class="container" id="capture-area">
    <div class="mode-toggle-container" data-html2canvas-ignore="true">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" onclick="toggleMode()" />
            <div class="slider">
                <i class="fa-solid fa-sun"></i>
                <i class="fa-solid fa-moon"></i>
            </div>
        </label>
    </div>

    <h1 class="header-title">คำนวณต้นทุนและกำไร</h1>
    <div class="warning-text">🏮 เสี่ยวหลงเปาพาคำนวณ 🏮</div>

    <div class="product-name-container">
        <label class="product-label" for="product_name"><i class="fa-solid fa-gift"></i> ชื่อสินค้า</label>
        <input type="text" id="product_name" class="input-full" placeholder="พิมพ์ชื่อสินค้าตรงนี้...">
    </div>

    <!-- ตารางบน -->
    <div class="chinese-table-wrapper">
        <div class="corner-tl"></div>
        <div class="corner-tr"></div>
        <table>
            <thead>
                <tr>
                    <th style="width: 25%;">ราคาประกาศ</th>
                    <th style="width: 20%;">%GP</th>
                    <th style="width: 27%;">ทุนA1</th>
                    <th style="width: 28%;">ต้นทุน+Vat</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="number" id="sale_price_1" oninput="calculateTable1()" placeholder="0" min="0" step="any"></td>
                    <td><input type="number" id="gp_percent" oninput="calculateTable1()" placeholder="0" min="0" step="any"></td>
                    <td id="cost_a1_result" class="bg-result-normal">0.00</td>
                    <td id="cost_result" class="bg-result-normal">0.00</td>
                </tr>
                <tr class="hidden-row">
                    <td id="sale_price_1_copy">0.00</td>
                    <td id="gp_percent_copy">0.00%</td>
                    <td></td>
                    <td id="gp_value">0.00</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ตารางล่าง -->
    <div class="chinese-table-wrapper">
        <div class="corner-tl"></div>
        <div class="corner-tr"></div>
        <table>
            <thead>
                <tr>
                    <th style="width: 35%;">ราคาขายจริง</th>
                    <th style="width: 35%;">ต้นทุน+Vat</th>
                    <th style="width: 30%;">%กำไร</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="number" id="sale_price_2" oninput="calculateTable2()" placeholder="0" min="0" step="any"></td>
                    <td id="cost_link" class="bg-result-normal">0.00</td>
                    <td class="bg-result-normal" style="padding: 5px 0;">
                        <div class="chart-container">
                            <svg width="100%" height="100%" viewBox="0 0 70 70">
                                <circle class="donut-bg" cx="35" cy="35" r="25" />
                                <circle class="donut-ring" id="donutRing" cx="35" cy="35" r="25" />
                            </svg>
                            <div class="chart-text">
                                <span class="chart-number" id="chartNumber">0.00%</span>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr class="hidden-row">
                    <td id="profit_diff">0.00</td>
                    <td id="profit_diff_copy">0.00</td>
                    <td id="sale_price_2_copy">0.00</td>
                    <td id="margin_percent_result">0.00%</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="button-group" data-html2canvas-ignore="true">
        <button class="btn btn-clear" onclick="clearAll()">เคลียร์ <i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="btn btn-save-data" onclick="addRecord()">บันทึก <i class="fa-solid fa-floppy-disk"></i></button>
        <button class="btn btn-capture" onclick="captureScreen()">เซฟรูป <i class="fa-solid fa-camera"></i></button>
        <button class="btn btn-excel" onclick="exportToExcel()">Excel <i class="fa-solid fa-file-excel"></i></button>
        <button class="btn btn-share" onclick="shareToApps()">แชร์ <i class="fa-solid fa-share-nodes"></i></button>
    </div>

    <div class="history-section">
        <div class="history-title"><i class="fa-solid fa-list-ul"></i> รายการสรุปที่บันทึกไว้</div>
        <div class="table-responsive">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>ชื่อสินค้า</th>
                        <th>ราคาประกาศ</th>
                        <th>%GP</th>
                        <th>ทุนA1</th>
                        <th>ต้นทุน+Vat</th>
                        <th>ราคาขายจริง</th>
                        <th>%กำไร</th>
                        <th data-html2canvas-ignore="true">ลบ</th>
                    </tr>
                </thead>
                <tbody id="history_tbody">
                    <tr id="empty_row">
                        <td colspan="8" style="text-align: center; color: var(--text-gold); font-style: italic;">ยังไม่มีข้อมูลที่บันทึกไว้</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let savedRecords = [];

window.onload = function() {
    loadSavedRecords();
};

function toggleMode() {
    const body = document.body;
    const checkbox = document.getElementById('checkbox');
    if (checkbox.checked) {
        body.classList.add('dark');
    } else {
        body.classList.remove('dark');
    }
    calculateTable2(); 
    refreshHistoryColors(); 
}

function calculateTable1() {
    let salePrice1 = parseFloat(document.getElementById('sale_price_1').value) || 0;
    let gpPercent = parseFloat(document.getElementById('gp_percent').value) || 0;
    
    let gpValue = salePrice1 * (gpPercent / 100);
    let cost = salePrice1 - gpValue;
    let costA1 = cost - (cost * 0.07);

    document.getElementById('gp_value').innerText = gpValue.toFixed(2);
    document.getElementById('sale_price_1_copy').innerText = salePrice1.toFixed(2);
    document.getElementById('gp_percent_copy').innerText = gpPercent.toFixed(2) + "%";
    
    document.getElementById('cost_result').innerText = cost.toFixed(2);
    document.getElementById('cost_a1_result').innerText = costA1.toFixed(2);
    document.getElementById('cost_link').innerText = cost.toFixed(2);

    calculateTable2();
}

function calculateTable2() {
    let salePrice2 = parseFloat(document.getElementById('sale_price_2').value) || 0;
    let cost = parseFloat(document.getElementById('cost_link').innerText) || 0;
    
    let profitDiff = salePrice2 - cost;
    let marginPercent = 0;

    if (salePrice2 > 0) {
        marginPercent = (profitDiff / salePrice2) * 100;
    }

    document.getElementById('profit_diff').innerText = profitDiff.toFixed(2);
    document.getElementById('profit_diff_copy').innerText = profitDiff.toFixed(2);
    document.getElementById('sale_price_2_copy').innerText = salePrice2.toFixed(2);
    document.getElementById('margin_percent_result').innerText = marginPercent.toFixed(2) + "%";

    updateDonutChart(marginPercent);
}

function updateDonutChart(percent) {
    const ring = document.getElementById('donutRing');
    const chartNum = document.getElementById('chartNumber');

    chartNum.innerText = percent.toFixed(2) + "%";
    
    // ตั้งค่าเงื่อนไขสี
    let color = '';
    if (percent < 0) {
        color = 'var(--color-loss)'; // สีแดง (-0.01 ลงไป)
    } else if (percent < 1.00) {
        color = 'var(--color-warning)'; // สีส้ม (0.00 ถึง 0.99)
    } else {
        color = 'var(--color-profit)'; // สีเขียว (1.00 ขึ้นไป)
    }

    ring.style.stroke = color;
    chartNum.style.color = color;

    let cappedPercent = Math.max(0, Math.min(100, percent));
    if (percent < 0) cappedPercent = Math.min(100, Math.abs(percent)); 

    const circumference = 157; 
    const offset = circumference - (cappedPercent / 100) * circumference;
    ring.style.strokeDashoffset = offset;
}

function addRecord() {
    let pName = document.getElementById('product_name').value.trim() || "สินค้าไม่ได้ระบุชื่อ";
    let salePrice1 = parseFloat(document.getElementById('sale_price_1').value) || 0;
    let gpPercent = parseFloat(document.getElementById('gp_percent').value) || 0;
    let cost = parseFloat(document.getElementById('cost_result').innerText) || 0;
    let costA1 = parseFloat(document.getElementById('cost_a1_result').innerText) || 0; 
    let salePrice2 = parseFloat(document.getElementById('sale_price_2').value) || 0;
    
    let marginText = document.getElementById('chartNumber').innerText;
    let marginPercent = parseFloat(marginText.replace('%', '')) || 0;

    let record = {
        id: Date.now(), 
        name: pName,
        price1: salePrice1,
        gp: gpPercent,
        cost: cost,
        costA1: costA1,
        price2: salePrice2,
        margin: marginPercent
    };

    savedRecords.push(record);
    localStorage.setItem('profit_calc_records', JSON.stringify(savedRecords)); 
    renderTable(); 

    document.getElementById('product_name').value = '';
    document.getElementById('product_name').focus();
}

function renderTable() {
    let tbody = document.getElementById('history_tbody');
    tbody.innerHTML = '';

    if (savedRecords.length === 0) {
        tbody.innerHTML = `
            <tr id="empty_row">
                <td colspan="8" style="text-align: center; color: var(--text-gold); font-style: italic;">ยังไม่มีข้อมูลที่บันทึกไว้</td>
            </tr>
        `;
        return;
    }

    savedRecords.forEach(record => {
        let tr = document.createElement('tr');
        let a1_cost_display = record.costA1 ? record.costA1 : 0;
        
        // กำหนดสีของ % กำไรในตารางประวัติให้ตรงกับเงื่อนไข
        let marginColor = '';
        if (record.margin < 0) {
            marginColor = 'var(--color-loss)';
        } else if (record.margin < 1.00) {
            marginColor = 'var(--color-warning)';
        } else {
            marginColor = 'var(--color-profit)';
        }

        tr.innerHTML = `
            <td style="text-align: left; font-weight: 600; color: var(--text-muted);">${record.name}</td>
            <td>${record.price1.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td>${record.gp.toFixed(2)}%</td>
            <td>${a1_cost_display.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td style="font-weight: 500;">${record.cost.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td>${record.price2.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td style="font-weight: bold; color: ${marginColor};">${record.margin.toFixed(2)}%</td>
            <td data-html2canvas-ignore="true"><button class="btn-delete" onclick="deleteRecord(${record.id})"><i class="fa-solid fa-trash-can"></i></button></td>
        `;
        tbody.appendChild(tr);
    });
}

function deleteRecord(id) {
    savedRecords = savedRecords.filter(r => r.id !== id);
    localStorage.setItem('profit_calc_records', JSON.stringify(savedRecords));
    renderTable();
}

function loadSavedRecords() {
    let data = localStorage.getItem('profit_calc_records');
    if (data) {
        savedRecords = JSON.parse(data);
        renderTable();
    }
}

function refreshHistoryColors() { renderTable(); }

function clearAll() {
    document.getElementById('product_name').value = '';
    document.getElementById('sale_price_1').value = '';
    document.getElementById('gp_percent').value = '';
    document.getElementById('sale_price_2').value = '';
    
    calculateTable1();
    document.getElementById('product_name').focus();
}

function exportToExcel() {
    if(savedRecords.length === 0) {
        alert("กรุณาบันทึกข้อมูลลงตารางสรุปผลก่อนส่งออกเป็น Excel ครับ!");
        return;
    }
    let excelData = savedRecords.map(item => ({
        "ชื่อสินค้า": item.name,
        "ราคาขายประกาศ": item.price1,
        "เปอร์เซ็นต์ GP": item.gp + "%",
        "ทุนA1": item.costA1 || 0,
        "ต้นทุน+Vat": item.cost,
        "ราคาขายจริง": item.price2,
        "เปอร์เซ็นต์กำไร": item.margin + "%"
    }));
    let wb = XLSX.utils.book_new();
    let ws = XLSX.utils.json_to_sheet(excelData);
    XLSX.utils.book_append_sheet(wb, ws, "สรุปผลต้นทุนและกำไร");
    XLSX.writeFile(wb, "สรุปรายการต้นทุนกำไร.xlsx");
}

function shareToApps() {
    const targetElement = document.getElementById('capture-area');
    html2canvas(targetElement, {
        scale: 2, backgroundColor: window.getComputedStyle(document.body).backgroundColor, useCORS: true
    }).then(canvas => {
        canvas.toBlob(function(blob) {
            if (navigator.canShare && navigator.share) {
                const file = new File([blob], "ผลคำนวณต้นทุนกำไร.png", { type: "image/png" });
                navigator.share({
                    files: [file], title: 'ผลการคำนวณต้นทุนและกำไร', text: 'แชร์ข้อมูลผลการคำนวณต้นทุนและผลประกอบการกำไรสินค้า'
                }).catch((e) => console.log(e));
            } else {
                downloadCanvas(blob);
            }
        }, 'image/png');
    });
}

function captureScreen() {
    const targetElement = document.getElementById('capture-area');
    html2canvas(targetElement, {
        scale: 2, backgroundColor: window.getComputedStyle(document.body).backgroundColor, useCORS: true
    }).then(canvas => {
        canvas.toBlob(function(blob) { downloadCanvas(blob); }, 'image/png');
    });
}

function downloadCanvas(blob) {
    const url = URL.createObjectURL(blob);
    const downloadLink = document.createElement('a');
    downloadLink.href = url;
    downloadLink.download = 'ผลการคำนวณต้นทุนและกำไร.png';
    document.body.appendChild(downloadLink);
    downloadLink.click();
    setTimeout(() => { document.body.removeChild(downloadLink); URL.revokeObjectURL(url); }, 100);
}
</script>
