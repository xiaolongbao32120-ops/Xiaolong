<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณต้นทุนและ GP2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #e6eedb;
            font-weight: bold;
        }
        .bg-yellow {
            background-color: #ffeb3b;
        }
        .bg-blue {
            background-color: #bbdefb;
        }
        .bg-orange {
            background-color: #ffe0b2;
        }
        input {
            width: 90%;
            padding: 6px;
            border: 1px solid #aaa;
            border-radius: 4px;
            text-align: right;
            font-size: 16px;
        }
        .label-red {
            color: red;
            font-weight: bold;
            text-align: left;
        }
        .btn-clear {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-clear:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

<div class="container">
    <table>
        <thead>
            <tr>
                <th class="bg-yellow">ราคาขายประกาศ</th>
                <th class="bg-yellow">%GP</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="sale_price_1" oninput="calculateTable1()" placeholder="0"></td>
                <td><input type="number" id="gp_percent" oninput="calculateTable1()" placeholder="0"></td>
                <td id="gp_value">0.00</td>
            </tr>
            <tr>
                <td id="sale_price_1_copy">0.00</td>
                <td id="gp_percent_copy">0.00%</td>
                <td id="cost_result" class="bg-orange" style="font-weight: bold;">0.00</td>
                <td class="label-red" style="border:none;"><--ต้นทุน</td>
            </tr>
        </tbody>
    </table>

    <table>
        <thead>
            <tr>
                <th class="bg-blue">ราคาที่ต้องการขาย</th>
                <th class="bg-blue">ราคาต้นทุน</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="sale_price_2" oninput="calculateTable2()" placeholder="0"></td>
                <td id="cost_link" class="bg-orange">0.00</td>
                <td id="profit_diff">0.00</td>
            </tr>
            <tr>
                <td id="profit_diff_copy">0.00</td>
                <td id="sale_price_2_copy">0.00</td>
                <td id="profit_percent_base">0.00</td>
            </tr>
            <tr>
                <td id="profit_diff_final">0.00</td>
                <td>100</td>
                <td id="margin_percent_result" class="bg-yellow" style="font-weight: bold;">0.00%</td>
                <td class="label-red" style="border:none;"><--%กำไร</td>
            </tr>
        </tbody>
    </table>

    <button class="btn-clear" onclick="clearAll()">เริ่มต้นใหม่</button>
</div>

<script>
function calculateTable1() {
    let salePrice1 = parseFloat(document.getElementById('sale_price_1').value) || 0;
    let gpPercent = parseFloat(document.getElementById('gp_percent').value) || 0;
    let gpValue = salePrice1 * (gpPercent / 100);
    let cost = salePrice1 - gpValue;

    document.getElementById('gp_value').innerText = gpValue.toFixed(2);
    document.getElementById('sale_price_1_copy').innerText = salePrice1.toFixed(2);
    document.getElementById('gp_percent_copy').innerText = gpPercent.toFixed(2) + "%";
    document.getElementById('cost_result').innerText = cost.toFixed(2);
    document.getElementById('cost_link').innerText = cost.toFixed(2);

    calculateTable2();
}

function calculateTable2() {
    let salePrice2 = parseFloat(document.getElementById('sale_price_2').value) || 0;
    let cost = parseFloat(document.getElementById('cost_link').innerText) || 0;
    let profitDiff = salePrice2 - cost;
    let marginPercent = 0;

    if (salePrice2 !== 0) {
        marginPercent = (profitDiff / salePrice2) * 100;
    } else if (salePrice2 === 0 && cost !== 0) {
        marginPercent = -100;
    }

    document.getElementById('profit_diff').innerText = profitDiff.toFixed(2);
    document.getElementById('profit_diff_copy').innerText = profitDiff.toFixed(2);
    document.getElementById('sale_price_2_copy').innerText = salePrice2.toFixed(2);
    
    let baseShare = salePrice2 !== 0 ? (profitDiff / salePrice2) : 0;
    document.getElementById('profit_percent_base').innerText = baseShare.toFixed(3);
    
    document.getElementById('profit_diff_final').innerText = profitDiff.toFixed(2);
    document.getElementById('margin_percent_result').innerText = marginPercent.toFixed(1) + "%";
}

function clearAll() {
    document.getElementById('sale_price_1').value = '';
    document.getElementById('gp_percent').value = '';
    document.getElementById('sale_price_2').value = '';
    calculateTable1();
}
</script>

</body>
</html>
