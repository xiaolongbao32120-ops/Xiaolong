<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณต้นทุนและกำไร</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="mon8888.png" type="image/jpeg">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* --- ตั้งค่าตัวแปรสีเริ่มต้น (Light Mode) --- */
        :root {
            --bg-body: #dbe2e6;
            --bg-container: #f6f3e6;
            --text-main: #2c3e50;
            --text-muted: #333333;
            --table-border: #d1cdb8;
            --table-cell-border: #e1ddc7;
            --table-bg: #fcfbfa;
            --input-border: #b0c4de;
            --input-bg: #ffffff;
            --input-text: #333333;
            
            --bg-orange: #f7dec5;
            --bg-highlight-yellow: #fff4a3;
            --bg-empty-th: #e5e3d3;
            --btn-toggle-color: #2c3e50;
        }

        /* --- สลับสีเมื่อเปิดใช้งานคลาส dark บน body --- */
        body.dark {
            --bg-body: #12181f;
            --bg-container: #1e252b;
            --text-main: #ffffff;
            --text-muted: #e0e0e0;
            --table-border: #454f5b;
            --table-cell-border: #38424d;
            --table-bg: #242c35;
            --input-border: #4f5b66;
            --input-bg: #1a2129;
            --input-text: #ffffff;
            
            --bg-orange: #5c3a21;
            --bg-highlight-yellow: #524811;
            --bg-empty-th: #2d3742;
            --btn-toggle-color: #f2d154;
        }

        body {
            font-family: 'Noto Sans Thai', 'Noto Sans', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .container {
            position: relative; /* สำหรับจัดตำแหน่งปุ่มพระจันทร์ */
            width: 100%;
            max-width: 620px;
            background-color: var(--bg-container);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.3s ease;
        }

        /* ปุ่มสลับโหมดดวงอาทิตย์ / พระจันทร์ บนเว็บเพจ */
        .mode-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--btn-toggle-color);
            transition: transform 0.2s, color 0.3s;
            padding: 5px;
        }

        .mode-toggle:hover {
            transform: scale(1.15);
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .warning-text {
            font-size: 13.5px;
            color: #c62828;
            text-align: center;
            font-weight: 500;
            margin-bottom: 25px;
        }

        body.dark .warning-text {
            color: #ff5252;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 25px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--table-border);
            background-color: var(--table-bg);
        }

        th, td {
            border-right: 1px solid var(--table-cell-border);
            border-bottom: 1px solid var(--table-cell-border);
            padding: 12px 10px;
            text-align: center;
            color: var(--text-muted);
            font-size: 16px;
        }

        th:last-child, td:last-child {
            border-right: none;
        }

        tr:last-child td {
            border-bottom: none;
        }

        th {
            font-weight: 600;
            font-size: 16px;
        }

        .bg-yellow {
            background: linear-gradient(to bottom, #f2d154, #dfba37);
            color: #222;
        }

        .bg-blue {
            background: linear-gradient(to bottom, #b9daf4, #9ec4e3);
            color: #1a365d;
        }

        .bg-empty-th {
            background-color: var(--bg-empty-th);
            color: var(--text-main) !important; 
            font-weight: bold;
        }

        .bg-orange {
            background-color: var(--bg-orange) !important;
        }

        .bg-highlight-yellow {
            background-color: var(--bg-highlight-yellow) !important;
        }

        input {
            width: 85%;
            padding: 8px 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            text-align: right;
            font-size: 16px;
            font-family: inherit;
            color: var(--input-text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.3s;
            background-color: var(--input-bg);
        }

        input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .hidden-row {
            display: none !important;
        }

        .button-group {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s, filter 0.2s;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-clear {
            background: linear-gradient(to bottom, #c62828, #b71c1c);
        }

        .btn-capture {
            background: linear-gradient(to bottom, #2e7d32, #1b5e20);
        }
    </style>
</head>
<body>

<div class="container" id="capture-area">
    <button class="mode-toggle" id="modeBtn" onclick="toggleMode()">
        <i class="fa-solid fa-moon"></i>
    </button>

    <h1 class="header-title">คำนวณต้นทุนและกำไร</h1>
    <div class="warning-text">คำนวณง่ายๆแค่ปลายนิ้วเรา</div>

    <table>
        <thead>
            <tr>
                <th class="bg-yellow" style="width: 40%;">ราคาขายประกาศ</th>
                <th class="bg-yellow" style="width: 40%;">%GP</th>
                <th class="bg-empty-th" style="width: 20%;">ราคาต้นทุน</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="sale_price_1" oninput="calculateTable1()" placeholder="0" min="0"></td>
                <td><input type="number" id="gp_percent" oninput="calculateTable1()" placeholder="0" min="0"></td>
                <td id="cost_result" class="bg-orange" style="font-weight: bold;">0.00</td>
            </tr>
            <tr class="hidden-row">
                <td id="sale_price_1_copy">0.00</td>
                <td id="gp_percent_copy">0.00%</td>
                <td id="gp_value">0.00</td>
            </tr>
        </tbody>
    </table>

    <table>
        <thead>
            <tr>
                <th class="bg-blue" style="width: 40%;">ราคาที่ต้องการขาย</th>
                <th class="bg-blue" style="width: 40%;">ราคาต้นทุน</th>
                <th class="bg-empty-th" style="width: 20%;">%GP</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="sale_price_2" oninput="calculateTable2()" placeholder="0" min="0"></td>
                <td id="cost_link" class="bg-orange">0.00</td>
                <td id="margin_percent_result" class="bg-highlight-yellow" style="font-weight: bold;">0.00%</td>
            </tr>
            <tr class="hidden-row">
                <td id="profit_diff">0.00</td>
                <td id="profit_diff_copy">0.00</td>
                <td id="sale_price_2_copy">0.00</td>
            </tr>
            <tr class="hidden-row">
                <td id="profit_percent_base">0.00</td>
                <td id="profit_diff_final">0.00</td>
                <td>100</td>
            </tr>
        </tbody>
    </table>

    <div class="button-group">
        <button class="btn btn-clear" onclick="clearAll()">คำนวณใหม่ <i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="btn btn-capture" onclick="captureScreen()">บันทึกเป็นรูปภาพ <i class="fa-solid fa-camera"></i></button>
    </div>
</div>

<script>
// ฟังก์ชันสำหรับสลับโหมดมืด/สว่างเมื่อคลิกปุ่ม
function toggleMode() {
    const body = document.body;
    const modeBtn = document.getElementById('modeBtn');
    
    body.classList.toggle('dark');
    
    // เปลี่ยนไอคอนตามโหมด
    if (body.classList.contains('dark')) {
        modeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
    } else {
        modeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
    }
}

function calculateTable1() {
    let salePrice1 = parseFloat(document.getElementById('sale_price_1').value) || 0;
    let gpPercent = parseFloat(document.getElementById('gp_percent').value) || 0;
    
    let gpValue = salePrice1 * (gpPercent / 100);
    let cost = salePrice1 - gpValue;

    document.getElementById('gp_value').innerText = gpValue.toFixed(2);
    document.getElementById('sale_price_1_copy').innerText = salePrice1.toFixed(2);
    document.getElementById('gp_percent_copy').innerText = gpPercent.toFixed(2) + "%";
    document.getElementById('cost_result').innerText = cost.toFixed(2);
    
    document.getElementById('cost_link').innerText = cost.toFixed(2);

    calculateTable2();
}

function calculateTable2() {
    let salePrice2 = parseFloat(document.getElementById('sale_price_2').value) || 0;
    let cost = parseFloat(document.getElementById('cost_link').innerText) || 0;
    
    let profitDiff = salePrice2 - cost;
    let marginPercent = 0;

    if (salePrice2 !== 0) {
        marginPercent = (profitDiff / salePrice2) * 100;
    } else if (salePrice2 === 0 && cost !== 0) {
        marginPercent = -100; 
    } else {
        marginPercent = 0;
    }

    document.getElementById('profit_diff').innerText = profitDiff.toFixed(2);
    document.getElementById('profit_diff_copy').innerText = profitDiff.toFixed(2);
    document.getElementById('sale_price_2_copy').innerText = salePrice2.toFixed(2);
    
    let baseShare = salePrice2 !== 0 ? (profitDiff / salePrice2) : 0;
    document.getElementById('profit_percent_base').innerText = baseShare.toFixed(3);
    
    document.getElementById('profit_diff_final').innerText = profitDiff.toFixed(2);
    
    let marginElement = document.getElementById('margin_percent_result');
    marginElement.innerText = marginPercent.toFixed(2) + "%";

    const isDark = document.body.classList.contains('dark');
    if (marginPercent >= 0) {
        marginElement.style.color = isDark ? "#4caf50" : "#2e7d32";
    } else {
        marginElement.style.color = isDark ? "#f44336" : "#c62828";
    }
}

function clearAll() {
    document.getElementById('sale_price_1').value = '';
    document.getElementById('gp_percent').value = '';
    document.getElementById('sale_price_2').value = '';
    
    calculateTable1();
    document.getElementById('sale_price_1').focus();
}

function captureScreen() {
    const targetElement = document.getElementById('capture-area');
    const currentContainerBg = window.getComputedStyle(targetElement).backgroundColor;

    // ซ่อนปุ่มพระจันทร์ชั่วคราวก่อนกดเซฟรูปภาพ เพื่อไม่ให้ติดไปในรูปภาพผลลัพธ์
    const modeBtn = document.getElementById('modeBtn');
    modeBtn.style.visibility = 'hidden';

    html2canvas(targetElement, {
        scale: 2, 
        backgroundColor: currentContainerBg, 
        useCORS: true
    }).then(canvas => {
        // แอบแสดงปุ่มพระจันทร์กลับมาเหมือนเดิมหลังจากจับภาพเสร็จ
        modeBtn.style.visibility = 'visible';

        const imageUri = canvas.toDataURL("image/png");
        const downloadLink = document.createElement('a');
        downloadLink.href = imageUri;
        downloadLink.download = 'ผลการคำนวณต้นทุนและกำไร.png';
        
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    });
}
</script>

</body>
</html>
