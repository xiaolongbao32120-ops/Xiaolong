<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- ปรับ Viewport ป้องกันการซูมอัตโนมัติเมื่อจิ้มช่องพิมพ์บนมือถือ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>หลงเปา</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dbe2e6">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="mon8888.png" type="image/jpeg">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        /* --- ตั้งค่าตัวแปรสีเริ่มต้น (Light Mode) --- */
        :root {
            --bg-body: #dbe2e6;
            --bg-container: #f6f3e6;
            --text-main: #2c3e50;
            --text-muted: #333333;
            --table-border: #d1cdb8;
            --table-cell-border: #e1ddc7;
            --table-bg: #fcfbfa;
            --input-border: #b0c4de;
            --input-bg: #ffffff;
            --input-text: #333333;
            
            --bg-result-white: #fcfbfa; 
            --bg-empty-th: #e5e3d3;
            --switch-bg: #b0c4de;
            --switch-btn: #ffffff;

            --color-profit: #2e7d32;   
            --color-warning: #e65100;  
            --color-loss: #c62828;     
            --chart-bg: #e5e3d3;
        }

        /* --- โหมดมืด (Dark Mode) --- */
        body.dark {
            --bg-body: #12181f;
            --bg-container: #1e252b;
            --text-main: #ffffff;
            --text-muted: #e0e0e0;
            --table-border: #454f5b;
            --table-cell-border: #38424d;
            --table-bg: #242c35;
            --input-border: #4f5b66;
            --input-bg: #1a2129;
            --input-text: #ffffff;
            
            --bg-result-white: #242c35; 
            --bg-empty-th: #2d3742;
            --switch-bg: #4f5b66;
            --switch-btn: #f2d154;

            --color-profit: #4caf50;   
            --color-warning: #ff9800;  
            --color-loss: #f44336;     
            --chart-bg: #2d3742;
        }

        body {
            font-family: 'Noto Sans Thai', 'Noto Sans', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 620px;
            background-color: var(--bg-container);
            padding: 35px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.3s ease;
            box-sizing: border-box;
        }

        /* --- สวิตช์โหมดมืด --- */
        .mode-toggle-container {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            align-items: center;
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .theme-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--switch-bg);
            transition: .4s; border-radius: 34px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 6px; box-sizing: border-box;
        }

        .slider i { font-size: 12px; z-index: 1; }
        .slider .fa-sun { color: #ffb74d; }
        .slider .fa-moon { color: #cfd8dc; }

        .slider:before {
            position: absolute; content: "";
            height: 22px; width: 22px; left: 4px; bottom: 4px;
            background-color: var(--switch-btn);
            transition: .4s; border-radius: 50%; z-index: 2;
        }

        input:checked + .slider:before { transform: translateX(30px); }

        .header-title {
            font-size: 28px; font-weight: 700;
            color: var(--text-main); text-align: center;
            margin-top: 10px; margin-bottom: 5px;
        }

        .warning-text {
            font-size: 13.5px; color: #c62828;
            text-align: center; font-weight: 500; margin-bottom: 25px;
        }
        body.dark .warning-text { color: #ff5252; }

        .product-name-container {
            width: 100%; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 6px;
        }

        .product-label {
            font-size: 15px; font-weight: 600; color: var(--text-main);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 15px;
            border: 1px solid var(--input-border);
            border-radius: 20px; 
            text-align: center; /* เปลี่ยนเป็นกึ่งกลางเพื่อให้สมดุลบนมือถือ */
            font-size: 16px; font-family: inherit;
            color: var(--input-text); outline: none;
            background-color: var(--input-bg);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .input-full { text-align: left !important; }

        table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            margin-bottom: 25px; border-radius: 15px; 
            overflow: hidden; border: 1px solid var(--table-border);
            background-color: var(--table-bg);
            table-layout: fixed; /* ล็อคขนาดไม่ให้ขยายตามข้อความ */
        }

        th, td {
            border-right: 1px solid var(--table-cell-border);
            border-bottom: 1px solid var(--table-cell-border);
            padding: 12px 6px; text-align: center;
            color: var(--text-muted); font-size: 14px;
            vertical-align: middle; word-wrap: break-word;
        }
        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }
        
        th { font-weight: 600; font-size: 13px; }

        .bg-yellow { background: linear-gradient(to bottom, #f2d154, #dfba37); color: #222; }
        .bg-blue { background: linear-gradient(to bottom, #b9daf4, #9ec4e3); color: #1a365d; }
        .bg-green-header { background: linear-gradient(to bottom, #a3e2a7, #7ecb83); color: #1b5e20; }
        .bg-empty-th { background-color: var(--bg-empty-th); color: var(--text-main) !important; font-weight: bold; }
        .bg-result-normal { background-color: var(--bg-result-white) !important; }

        .text-profit { color: var(--color-profit) !important; }
        .text-warning { color: var(--color-warning) !important; }
        .text-loss { color: var(--color-loss) !important; }

        .hidden-row { display: none !important; }

        .chart-container {
            display: inline-flex; justify-content: center; align-items: center;
            position: relative; width: 65px; height: 65px; margin: auto;
        }
        .donut-bg { fill: none; stroke: var(--chart-bg); stroke-width: 9; }
        .donut-ring {
            fill: none; stroke: var(--color-profit); stroke-width: 9;
            stroke-linecap: round; stroke-dasharray: 157; stroke-dashoffset: 157;
            transition: stroke-dashoffset 0.4s ease, stroke 0.3s;
            transform: rotate(-90deg); transform-origin: 35px 35px;
        }
        .chart-text {
            position: absolute; display: flex; flex-direction: column;
            justify-content: center; align-items: center; width: 100%;
        }
        .chart-number { font-size: 12px; font-weight: 700; color: var(--color-profit); transition: color 0.3s; }

        .button-group {
            display: flex; gap: 10px; width: 100%;
            margin-bottom: 25px; flex-wrap: wrap; justify-content: center;
        }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            flex: 1; min-width: calc(33% - 10px); padding: 12px 8px;
            color: white; border: none; border-radius: 20px; 
            font-size: 14px; cursor: pointer; font-weight: 500;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-clear { background: linear-gradient(to bottom, #c62828, #b71c1c); }
        .btn-save-data { background: linear-gradient(to bottom, #1565c0, #0d47a1); }
        .btn-capture { background: linear-gradient(to bottom, #2e7d32, #1b5e20); }
        .btn-excel { background: linear-gradient(to bottom, #e28743, #b85d14); }
        .btn-share { background: linear-gradient(to bottom, #8e44ad, #71328c); }

        .btn-delete {
            background: #ff5252; color: white; border: none;
            border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px;
        }

        .history-section { margin-top: 10px; width: 100%; }
        .history-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .table-responsive {
            width: 100%; overflow-x: auto;
            -webkit-overflow-scrolling: touch; /* เลื่อนลื่นบน iOS */
        }
        
        /* ปลดล็อคความกว้างให้ตารางล่างสุดสไลด์ได้ */
        .history-table {
            table-layout: auto;
            min-width: 600px; 
        }
        .history-table th, .history-table td {
            white-space: nowrap; 
            font-size: 13px;
        }

        /* ====== ปรับแต่งเฉพาะหน้าจอมือถือ (Responsive Mobile) ====== */
        @media (max-width: 500px) {
            body { padding: 15px 10px; }
            .container { padding: 20px 15px; border-radius: 20px; }
            .mode-toggle-container { top: 15px; right: 15px; }
            .header-title { font-size: 24px; margin-top: 15px; }
            
            table { margin-bottom: 15px; }
            th, td { padding: 8px 2px; }
            th { font-size: 11px; }
            td { font-size: 13px; }
            
            input { padding: 8px 5px; font-size: 14px; border-radius: 12px; }
            
            .btn { min-width: calc(48% - 5px); padding: 10px 5px; font-size: 13px; border-radius: 15px; }
            .button-group { gap: 8px; }

            .chart-container { width: 55px; height: 55px; }
            .chart-number { font-size: 11px; }

            .history-title { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="container" id="capture-area">
    <div class="mode-toggle-container" data-html2canvas-ignore="true">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" onclick="toggleMode()" />
            <div class="slider">
                <i class="fa-solid fa-sun"></i>
                <i class="fa-solid fa-moon"></i>
            </div>
        </label>
    </div>

    <h1 class="header-title">คำนวณต้นทุนและกำไร</h1>
    <div class="warning-text">เสี่ยวหลงเปาพาคำนวณ</div>

    <div class="product-name-container">
        <label class="product-label" for="product_name"><i class="fa-solid fa-box"></i> ชื่อสินค้า</label>
        <input type="text" id="product_name" class="input-full" placeholder="พิมพ์ชื่อสินค้าตรงนี้...">
    </div>

    <table>
        <thead>
            <tr>
                <th class="bg-yellow" style="width: 25%;">ราคาประกาศ</th>
                <th class="bg-yellow" style="width: 20%;">%GP</th>
                <th class="bg-empty-th" style="width: 28%;">ต้นทุน+Vat</th>
                <th class="bg-empty-th" style="width: 27%;">ทุนA1</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="sale_price_1" oninput="calculateTable1()" placeholder="0" min="0" step="any"></td>
                <td><input type="number" id="gp_percent" oninput="calculateTable1()" placeholder="0" min="0" step="any"></td>
                <td id="cost_result" class="bg-result-normal" style="font-weight: bold;">0.00</td>
                <td id="cost_a1_result" class="bg-result-normal" style="font-weight: bold; color: var(--color-warning);">0.00</td>
            </tr>
            <tr class="hidden-row">
                <td id="sale_price_1_copy">0.00</td>
                <td id="gp_percent_copy">0.00%</td>
                <td id="gp_value">0.00</td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <table>
        <thead>
            <tr>
                <th class="bg-blue" style="width: 35%;">ราคาขายจริง</th>
                <th class="bg-blue" style="width: 35%;">ต้นทุน+Vat</th>
                <th class="bg-empty-th" style="width: 30%;">%กำไร</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="sale_price_2" oninput="calculateTable2()" placeholder="0" min="0" step="any"></td>
                <td id="cost_link" class="bg-result-normal">0.00</td>
                <td class="bg-result-normal" style="padding: 2px 0;">
                    <div class="chart-container">
                        <!-- ปรับ SVG ให้ขยายตามคอนเทนเนอร์อัตโนมัติ -->
                        <svg width="100%" height="100%" viewBox="0 0 70 70">
                            <circle class="donut-bg" cx="35" cy="35" r="25" />
                            <circle class="donut-ring" id="donutRing" cx="35" cy="35" r="25" />
                        </svg>
                        <div class="chart-text">
                            <span class="chart-number" id="chartNumber">0.00%</span>
                        </div>
                    </div>
                </td>
            </tr>
            <tr class="hidden-row">
                <td id="profit_diff">0.00</td>
                <td id="profit_diff_copy">0.00</td>
                <td id="sale_price_2_copy">0.00</td>
                <td id="margin_percent_result">0.00%</td>
            </tr>
            <tr class="hidden-row">
                <td id="profit_percent_base">0.00</td>
                <td id="profit_diff_final">0.00</td>
                <td>100</td>
            </tr>
        </tbody>
    </table>

    <div class="button-group" data-html2canvas-ignore="true">
        <button class="btn btn-clear" onclick="clearAll()">เคลียร์<i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="btn btn-save-data" onclick="addRecord()">บันทึก <i class="fa-solid fa-floppy-disk"></i></button>
        <button class="btn btn-capture" onclick="captureScreen()">เซฟรูป <i class="fa-solid fa-camera"></i></button>
        <button class="btn btn-excel" onclick="exportToExcel()">Excel <i class="fa-solid fa-file-excel"></i></button>
        <button class="btn btn-share" onclick="shareToApps()">แชร์ <i class="fa-solid fa-share-nodes"></i></button>
    </div>

    <div class="history-section">
        <div class="history-title"><i class="fa-solid fa-list-check"></i> รายการสรุปที่บันทึกไว้</div>
        <div class="table-responsive">
            <table class="history-table">
                <thead>
                    <tr>
                        <th class="bg-green-header">ชื่อสินค้า</th>
                        <th class="bg-green-header">ราคาประกาศ</th>
                        <th class="bg-green-header">%GP</th>
                        <th class="bg-green-header">ต้นทุน+Vat</th>
                        <th class="bg-green-header">ทุนA1</th>
                        <th class="bg-green-header">ราคาขายจริง</th>
                        <th class="bg-green-header">%กำไร</th>
                        <th class="bg-green-header" data-html2canvas-ignore="true">ลบ</th>
                    </tr>
                </thead>
                <tbody id="history_tbody">
                    <tr id="empty_row">
                        <td colspan="8" style="text-align: center; color: #999; font-style: italic;">ยังไม่มีข้อมูลที่บันทึกไว้</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let savedRecords = [];

window.onload = function() {
    loadSavedRecords();
};

function toggleMode() {
    const body = document.body;
    const checkbox = document.getElementById('checkbox');
    if (checkbox.checked) {
        body.classList.add('dark');
    } else {
        body.classList.remove('dark');
    }
    calculateTable2(); 
    refreshHistoryColors(); 
}

function calculateTable1() {
    let salePrice1 = parseFloat(document.getElementById('sale_price_1').value) || 0;
    let gpPercent = parseFloat(document.getElementById('gp_percent').value) || 0;
    
    let gpValue = salePrice1 * (gpPercent / 100);
    let cost = salePrice1 - gpValue;
    
    let costA1 = cost - (cost * 0.07);

    document.getElementById('gp_value').innerText = gpValue.toFixed(2);
    document.getElementById('sale_price_1_copy').innerText = salePrice1.toFixed(2);
    document.getElementById('gp_percent_copy').innerText = gpPercent.toFixed(2) + "%";
    
    document.getElementById('cost_result').innerText = cost.toFixed(2);
    document.getElementById('cost_a1_result').innerText = costA1.toFixed(2);
    
    document.getElementById('cost_link').innerText = cost.toFixed(2);

    calculateTable2();
}

function calculateTable2() {
    let salePrice2 = parseFloat(document.getElementById('sale_price_2').value) || 0;
    let cost = parseFloat(document.getElementById('cost_link').innerText) || 0;
    
    let profitDiff = salePrice2 - cost;
    let marginPercent = 0;

    if (salePrice2 > 0) {
        marginPercent = (profitDiff / salePrice2) * 100;
    } else {
        marginPercent = 0;
    }

    document.getElementById('profit_diff').innerText = profitDiff.toFixed(2);
    document.getElementById('profit_diff_copy').innerText = profitDiff.toFixed(2);
    document.getElementById('sale_price_2_copy').innerText = salePrice2.toFixed(2);
    
    let baseShare = salePrice2 !== 0 ? (profitDiff / salePrice2) : 0;
    document.getElementById('profit_percent_base').innerText = baseShare.toFixed(3);
    document.getElementById('profit_diff_final').innerText = profitDiff.toFixed(2);
    document.getElementById('margin_percent_result').innerText = marginPercent.toFixed(2) + "%";

    updateDonutChart(marginPercent);
}

function updateDonutChart(percent) {
    const ring = document.getElementById('donutRing');
    const chartNum = document.getElementById('chartNumber');
    const isDark = document.body.classList.contains('dark');

    chartNum.innerText = percent.toFixed(2) + "%";
    chartNum.classList.remove('text-profit', 'text-warning', 'text-loss');

    let strokeColor = isDark ? '#4caf50' : '#2e7d32'; 
    if (percent < 0) {
        strokeColor = isDark ? '#f44336' : '#c62828'; 
        chartNum.classList.add('text-loss');
    } else if (percent >= 0 && percent <= 0.99) {
        strokeColor = isDark ? '#ff9800' : '#e65100'; 
        chartNum.classList.add('text-warning');
    } else {
        chartNum.classList.add('text-profit');
    }

    ring.style.stroke = strokeColor;

    let cappedPercent = Math.max(0, Math.min(100, percent));
    if (percent < 0) {
        cappedPercent = Math.min(100, Math.abs(percent)); 
    }

    const circumference = 157; 
    const offset = circumference - (cappedPercent / 100) * circumference;
    ring.style.strokeDashoffset = offset;
}

function addRecord() {
    let pName = document.getElementById('product_name').value.trim() || "สินค้าไม่ได้ระบุชื่อ";
    let salePrice1 = parseFloat(document.getElementById('sale_price_1').value) || 0;
    let gpPercent = parseFloat(document.getElementById('gp_percent').value) || 0;
    let cost = parseFloat(document.getElementById('cost_result').innerText) || 0;
    let costA1 = parseFloat(document.getElementById('cost_a1_result').innerText) || 0; 
    let salePrice2 = parseFloat(document.getElementById('sale_price_2').value) || 0;
    
    let marginText = document.getElementById('chartNumber').innerText;
    let marginPercent = parseFloat(marginText.replace('%', '')) || 0;

    let record = {
        id: Date.now(), 
        name: pName,
        price1: salePrice1,
        gp: gpPercent,
        cost: cost,
        costA1: costA1,
        price2: salePrice2,
        margin: marginPercent
    };

    savedRecords.push(record);
    localStorage.setItem('profit_calc_records', JSON.stringify(savedRecords)); 

    renderTable(); 

    document.getElementById('product_name').value = '';
    document.getElementById('product_name').focus();
}

function renderTable() {
    let tbody = document.getElementById('history_tbody');
    tbody.innerHTML = '';

    if (savedRecords.length === 0) {
        tbody.innerHTML = `
            <tr id="empty_row">
                <td colspan="8" style="text-align: center; color: #999; font-style: italic;">ยังไม่มีข้อมูลที่บันทึกไว้</td>
            </tr>
        `;
        return;
    }

    savedRecords.forEach(record => {
        let tr = document.createElement('tr');
        let colorClass = 'text-profit';
        if (record.margin < 0) {
            colorClass = 'text-loss';
        } else if (record.margin >= 0 && record.margin <= 0.99) {
            colorClass = 'text-warning';
        }

        let a1_cost_display = record.costA1 ? record.costA1 : 0;

        tr.innerHTML = `
            <td style="text-align: center; font-weight: 500;">${record.name}</td>
            <td>${record.price1.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td>${record.gp.toFixed(2)}%</td>
            <td style="font-weight: 500;">${record.cost.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td style="color: var(--color-warning);">${a1_cost_display.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td>${record.price2.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td class="${colorClass}" style="font-weight: bold;" data-margin="${record.margin}">${record.margin.toFixed(2)}%</td>
            <td data-html2canvas-ignore="true"><button class="btn-delete" onclick="deleteRecord(${record.id})"><i class="fa-solid fa-trash-can"></i></button></td>
        `;
        tbody.appendChild(tr);
    });
}

function deleteRecord(id) {
    savedRecords = savedRecords.filter(r => r.id !== id);
    localStorage.setItem('profit_calc_records', JSON.stringify(savedRecords));
    renderTable();
}

function loadSavedRecords() {
    let data = localStorage.getItem('profit_calc_records');
    if (data) {
        savedRecords = JSON.parse(data);
        renderTable();
    }
}

function exportToExcel() {
    if(savedRecords.length === 0) {
        alert("กรุณาบันทึกข้อมูลลงตารางสรุปผลก่อนส่งออกเป็น Excel ครับ!");
        return;
    }

    let excelData = savedRecords.map(item => ({
        "ชื่อสินค้า": item.name,
        "ราคาขายประกาศ": item.price1,
        "เปอร์เซ็นต์ GP": item.gp + "%",
        "ต้นทุน+Vat": item.cost,
        "ทุนA1": item.costA1 || 0,
        "ราคาขายจริง": item.price2,
        "เปอร์เซ็นต์กำไร": item.margin + "%"
    }));

    let wb = XLSX.utils.book_new();
    let ws = XLSX.utils.json_to_sheet(excelData);
    XLSX.utils.book_append_sheet(wb, ws, "สรุปผลต้นทุนและกำไร");
    XLSX.writeFile(wb, "สรุปรายการต้นทุนกำไร.xlsx");
}

function shareToApps() {
    const targetElement = document.getElementById('capture-area');
    const currentContainerBg = window.getComputedStyle(targetElement).backgroundColor;

    html2canvas(targetElement, {
        scale: 2, 
        backgroundColor: currentContainerBg, 
        useCORS: true,
        logging: false
    }).then(canvas => {
        canvas.toBlob(function(blob) {
            if (navigator.canShare && navigator.share) {
                const file = new File([blob], "ผลคำนวณต้นทุนกำไร.png", { type: "image/png" });
                navigator.share({
                    files: [file],
                    title: 'ผลการคำนวณต้นทุนและกำไร',
                    text: 'แชร์ข้อมูลผลการคำนวณต้นทุนและผลประกอบการกำไรสินค้า'
                })
                .then(() => console.log('แชร์ไฟล์สำเร็จแล้ว'))
                .catch((error) => console.log('ผู้ใช้ยกเลิกการแชร์ หรือแชร์ไม่สำเร็จ:', error));
            } else {
                alert("ระบบแชร์อัตโนมัติไม่ทำงานบนอุปกรณ์ชิ้นนี้ ระบบได้ทำการดาวน์โหลดไฟล์รูปภาพลงเครื่องให้แทนแล้วครับ");
                const url = URL.createObjectURL(blob);
                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = 'แชร์ผลการคำนวณต้นทุนและกำไร.png';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            }
        }, 'image/png');
    });
}

function captureScreen() {
    const targetElement = document.getElementById('capture-area');
    const currentContainerBg = window.getComputedStyle(targetElement).backgroundColor;

    html2canvas(targetElement, {
        scale: 2, 
        backgroundColor: currentContainerBg, 
        useCORS: true,
        logging: false
    }).then(canvas => {
        try {
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = 'ผลการคำนวณต้นทุนและกำไร.png';
                
                document.body.appendChild(downloadLink);
                downloadLink.click();
                
                setTimeout(() => {
                    document.body.removeChild(downloadLink);
                    URL.revokeObjectURL(url);
                }, 100);
            }, 'image/png');
        } catch (e) {
            const imageUri = canvas.toDataURL("image/png");
            const downloadLink = document.createElement('a');
            downloadLink.href = imageUri;
            downloadLink.download = 'ผลการคำนวณต้นทุนและกำไร.png';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    });
}
