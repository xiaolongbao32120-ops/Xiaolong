<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณต้นทุนและกำไร</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dbe2e6">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="mon8888.png" type="image/jpeg">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* --- ตั้งค่าตัวแปรสีเริ่มต้น (Light Mode) --- */
        :root {
            --bg-body: #dbe2e6;
            --bg-container: #f6f3e6;
            --text-main: #2c3e50;
            --text-muted: #333333;
            --table-border: #d1cdb8;
            --table-cell-border: #e1ddc7;
            --table-bg: #fcfbfa;
            --input-border: #b0c4de;
            --input-bg: #ffffff;
            --input-text: #333333;
            
            --bg-result-white: #fcfbfa; 
            --bg-empty-th: #e5e3d3;
            --btn-toggle-color: #2c3e50;

            /* ตัวแปรสีสถานะตามเงื่อนไข */
            --color-profit: #2e7d32;   /* เขียว */
            --color-warning: #e65100;  /* ส้ม (0 - 0.99) */
            --color-loss: #c62828;     /* แดง (ติดลบ) */
        }

        /* --- สลับสีเมื่อเปิดใช้งานคลาส dark บน body --- */
        body.dark {
            --bg-body: #12181f;
            --bg-container: #1e252b;
            --text-main: #ffffff;
            --text-muted: #e0e0e0;
            --table-border: #454f5b;
            --table-cell-border: #38424d;
            --table-bg: #242c35;
            --input-border: #4f5b66;
            --input-bg: #1a2129;
            --input-text: #ffffff;
            
            --bg-result-white: #242c35; 
            --bg-empty-th: #2d3742;
            --btn-toggle-color: #f2d154;

            /* สีสถานะในโหมดมืด */
            --color-profit: #4caf50;   /* เขียวสว่าง */
            --color-warning: #ff9800;  /* ส้มสว่าง (0 - 0.99) */
            --color-loss: #f44336;     /* แดงสว่าง */
        }

        body {
            font-family: 'Noto Sans Thai', 'Noto Sans', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 620px;
            background-color: var(--bg-container);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.3s ease;
        }

        .mode-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--btn-toggle-color);
            transition: transform 0.2s, color 0.3s;
            padding: 5px;
        }

        .mode-toggle:hover {
            transform: scale(1.15);
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .warning-text {
            font-size: 13.5px;
            color: #c62828;
            text-align: center;
            font-weight: 500;
            margin-bottom: 25px;
        }

        body.dark .warning-text {
            color: #ff5252;
        }

        /* โซนกล่องใส่ชื่อสินค้า */
        .product-name-container {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .product-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-full {
            width: 100% !important;
            text-align: left !important;
            box-sizing: border-box;
            padding: 10px 12px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 25px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--table-border);
            background-color: var(--table-bg);
        }

        th, td {
            border-right: 1px solid var(--table-cell-border);
            border-bottom: 1px solid var(--table-cell-border);
            padding: 12px 10px;
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
        }

        th:last-child, td:last-child {
            border-right: none;
        }

        tr:last-child td {
            border-bottom: none;
        }

        th {
            font-weight: 600;
            font-size: 15px;
        }

        .bg-yellow {
            background: linear-gradient(to bottom, #f2d154, #dfba37);
            color: #222;
        }

        .bg-blue {
            background: linear-gradient(to bottom, #b9daf4, #9ec4e3);
            color: #1a365d;
        }

        .bg-green-header {
            background: linear-gradient(to bottom, #a3e2a7, #7ecb83);
            color: #1b5e20;
        }

        .bg-empty-th {
            background-color: var(--bg-empty-th);
            color: var(--text-main) !important; 
            font-weight: bold;
        }

        .bg-result-normal {
            background-color: var(--bg-result-white) !important;
        }

        .text-profit {
            color: var(--color-profit) !important;
        }
        .text-warning {
            color: var(--color-warning) !important;
        }
        .text-loss {
            color: var(--color-loss) !important;
        }

        input {
            width: 85%;
            padding: 8px 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            text-align: right;
            font-size: 16px;
            font-family: inherit;
            color: var(--input-text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.3s;
            background-color: var(--input-bg);
        }

        input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .hidden-row {
            display: none !important;
        }

        .button-group {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            min-width: 130px;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s, filter 0.2s;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-clear { background: linear-gradient(to bottom, #c62828, #b71c1c); }
        .btn-save-data { background: linear-gradient(to bottom, #1565c0, #0d47a1); }
        .btn-capture { background: linear-gradient(to bottom, #2e7d32, #1b5e20); }

        .btn-delete {
            background: #ff5252;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-delete:hover { background: #e04444; }

        /* ส่วนของตารางสรุปด้านล่าง */
        .history-section {
            margin-top: 10px;
        }
        .history-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }
        .history-table th {
            font-size: 13px;
            padding: 10px 5px;
        }
        .history-table td {
            font-size: 13px;
            padding: 10px 5px;
        }
    </style>
</head>
<body>

<div class="container" id="capture-area">
    <button class="mode-toggle" id="modeBtn" onclick="toggleMode()">
        <i class="fa-solid fa-moon"></i>
    </button>

    <h1 class="header-title">คำนวณต้นทุนและกำไร</h1>
    <div class="warning-text">คำนวณง่ายๆแค่ปลายนิ้วเรา</div>

    <div class="product-name-container">
        <label class="product-label" for="product_name"><i class="fa-solid fa-box"></i> ชื่อสินค้า</label>
        <input type="text" id="product_name" class="input-full" placeholder="พิมพ์ชื่อสินค้าตรงนี้...">
    </div>

    <table>
        <thead>
            <tr>
                <th class="bg-yellow" style="width: 40%;">ราคาขายประกาศ</th>
                <th class="bg-yellow" style="width: 40%;">%GP</th>
                <th class="bg-empty-th" style="width: 20%;">ราคาต้นทุน</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="sale_price_1" oninput="calculateTable1()" placeholder="0" min="0" step="any"></td>
                <td><input type="number" id="gp_percent" oninput="calculateTable1()" placeholder="0" min="0" step="any"></td>
                <td id="cost_result" class="bg-result-normal" style="font-weight: bold;">0.00</td>
            </tr>
            <tr class="hidden-row">
                <td id="sale_price_1_copy">0.00</td>
                <td id="gp_percent_copy">0.00%</td>
                <td id="gp_value">0.00</td>
            </tr>
        </tbody>
    </table>

    <table>
        <thead>
            <tr>
                <th class="bg-blue" style="width: 40%;">ราคาที่ต้องการขาย</th>
                <th class="bg-blue" style="width: 40%;">ราคาต้นทุน</th>
                <th class="bg-empty-th" style="width: 20%;">%GP</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="sale_price_2" oninput="calculateTable2()" placeholder="0" min="0" step="any"></td>
                <td id="cost_link" class="bg-result-normal">0.00</td>
                <td id="margin_percent_result" class="bg-result-normal" style="font-weight: bold;">0.00%</td>
            </tr>
            <tr class="hidden-row">
                <td id="profit_diff">0.00</td>
                <td id="profit_diff_copy">0.00</td>
                <td id="sale_price_2_copy">0.00</td>
            </tr>
            <tr class="hidden-row">
                <td id="profit_percent_base">0.00</td>
                <td id="profit_diff_final">0.00</td>
                <td>100</td>
            </tr>
        </tbody>
    </table>

    <div class="button-group">
        <button class="btn btn-clear" onclick="clearAll()">คำนวณใหม่ <i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="btn btn-save-data" onclick="addRecord()">บันทึกข้อมูล <i class="fa-solid fa-floppy-disk"></i></button>
        <button class="btn btn-capture" onclick="captureScreen()">บันทึกเป็นรูปภาพ <i class="fa-solid fa-camera"></i></button>
    </div>

    <div class="history-section">
        <div class="history-title"><i class="fa-solid fa-list-check"></i> รายการสรุปที่บันทึกไว้</div>
        <div class="table-responsive">
            <table class="history-table">
                <thead>
                    <tr>
                        <th class="bg-green-header" style="width: 25%;">ชื่อสินค้า</th>
                        <th class="bg-green-header" style="width: 15%;">ราคาประกาศ</th>
                        <th class="bg-green-header" style="width: 12%;">%GP</th>
                        <th class="bg-green-header" style="width: 15%;">ต้นทุน</th>
                        <th class="bg-green-header" style="width: 15%;">ราคาขายจริง</th>
                        <th class="bg-green-header" style="width: 13%;">%กำไร</th>
                        <th class="bg-green-header" style="width: 5%;" data-html2canvas-ignore="true">ลบ</th>
                    </tr>
                </thead>
                <tbody id="history_tbody">
                    <tr id="empty_row">
                        <td colspan="7" style="text-align: center; color: #999; font-style: italic;">ยังไม่มีข้อมูลที่บันทึกไว้</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function toggleMode() {
    const body = document.body;
    const modeBtn = document.getElementById('modeBtn');
    
    body.classList.toggle('dark');
    
    if (body.classList.contains('dark')) {
        modeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
    } else {
        modeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
    }
    calculateTable2(); 
    refreshHistoryColors(); // อัปเดตสีตารางล่างตามโหมดมืด/สว่างด้วย
}

function calculateTable1() {
    let salePrice1 = parseFloat(document.getElementById('sale_price_1').value) || 0;
    let gpPercent = parseFloat(document.getElementById('gp_percent').value) || 0;
    
    let gpValue = salePrice1 * (gpPercent / 100);
    let cost = salePrice1 - gpValue;

    document.getElementById('gp_value').innerText = gpValue.toFixed(2);
    document.getElementById('sale_price_1_copy').innerText = salePrice1.toFixed(2);
    document.getElementById('gp_percent_copy').innerText = gpPercent.toFixed(2) + "%";
    document.getElementById('cost_result').innerText = cost.toFixed(2);
    
    document.getElementById('cost_link').innerText = cost.toFixed(2);

    calculateTable2();
}

function calculateTable2() {
    let salePrice2 = parseFloat(document.getElementById('sale_price_2').value) || 0;
    let cost = parseFloat(document.getElementById('cost_link').innerText) || 0;
    
    let profitDiff = salePrice2 - cost;
    let marginPercent = 0;

    if (salePrice2 > 0) {
        marginPercent = (profitDiff / salePrice2) * 100;
    } else {
        marginPercent = 0;
    }

    document.getElementById('profit_diff').innerText = profitDiff.toFixed(2);
    document.getElementById('profit_diff_copy').innerText = profitDiff.toFixed(2);
    document.getElementById('sale_price_2_copy').innerText = salePrice2.toFixed(2);
    
    let baseShare = salePrice2 !== 0 ? (profitDiff / salePrice2) : 0;
    document.getElementById('profit_percent_base').innerText = baseShare.toFixed(3);
    
    document.getElementById('profit_diff_final').innerText = profitDiff.toFixed(2);
    
    let marginElement = document.getElementById('margin_percent_result');
    marginElement.innerText = marginPercent.toFixed(2) + "%";

    marginElement.classList.remove('text-profit', 'text-warning', 'text-loss');

    if (marginPercent < 0) {
        marginElement.classList.add('text-loss');    
    } else if (marginPercent >= 0 && marginPercent <= 0.99) {
        marginElement.classList.add('text-warning'); 
    } else {
        marginElement.classList.add('text-profit');  
    }
}

// ฟังก์ชันเพิ่มข้อมูลลงตารางด้านล่าง
function addRecord() {
    let pName = document.getElementById('product_name').value.trim() || "สินค้าไม่ได้ระบุชื่อ";
    let salePrice1 = parseFloat(document.getElementById('sale_price_1').value) || 0;
    let gpPercent = parseFloat(document.getElementById('gp_percent').value) || 0;
    let cost = parseFloat(document.getElementById('cost_result').innerText) || 0;
    let salePrice2 = parseFloat(document.getElementById('sale_price_2').value) || 0;
    let marginPercent = parseFloat(document.getElementById('margin_percent_result').innerText) || 0;

    // เช็คแถวว่างแรกสุด
    let emptyRow = document.getElementById('empty_row');
    if (emptyRow) {
        emptyRow.remove();
    }

    let tbody = document.getElementById('history_tbody');
    let tr = document.createElement('tr');

    // กำหนดสีตัวเลขสำหรับคอลัมน์ %กำไร ในตารางสรุป
    let colorClass = 'text-profit';
    if (marginPercent < 0) {
        colorClass = 'text-loss';
    } else if (marginPercent >= 0 && marginPercent <= 0.99) {
        colorClass = 'text-warning';
    }

    tr.innerHTML = `
        <td style="text-align: left; font-weight: 500;">${pName}</td>
        <td>${salePrice1.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
        <td>${gpPercent.toFixed(2)}%</td>
        <td style="font-weight: 500;">${cost.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
        <td>${salePrice2.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
        <td class="${colorClass}" style="font-weight: bold;" data-margin="${marginPercent}">${marginPercent.toFixed(2)}%</td>
        <td data-html2canvas-ignore="true"><button class="btn-delete" onclick="deleteRow(this)"><i class="fa-solid fa-trash-can"></i></button></td>
    `;

    tbody.appendChild(tr);

    // เคลียร์ค่าชื่อสินค้าออกเพื่อให้คีย์ชิ้นต่อไปได้เลย
    document.getElementById('product_name').value = '';
}

// ฟังก์ชันลบแถวที่เลือก
function deleteRow(button) {
    button.closest('tr').remove();
    let tbody = document.getElementById('history_tbody');
    if (tbody.children.length === 0) {
        tbody.innerHTML = `
            <tr id="empty_row">
                <td colspan="7" style="text-align: center; color: #999; font-style: italic;">ยังไม่มีข้อมูลที่บันทึกไว้</td>
            </tr>
        `;
    }
}

// อัปเดตสีตัวเลขของตารางสรุปตอนกดเปลี่ยนธีมมืด/สว่าง
function refreshHistoryColors() {
    let rows = document.querySelectorAll('#history_tbody tr:not(#empty_row)');
    rows.forEach(row => {
        let marginTd = row.children[5];
        let val = parseFloat(marginTd.getAttribute('data-margin')) || 0;
        marginTd.classList.remove('text-profit', 'text-warning', 'text-loss');
        if (val < 0) {
            marginTd.classList.add('text-loss');
        } else if (val >= 0 && val <= 0.99) {
            marginTd.classList.add('text-warning');
        } else {
            marginTd.classList.add('text-profit');
        }
    });
}

function clearAll() {
    document.getElementById('product_name').value = '';
    document.getElementById('sale_price_1').value = '';
    document.getElementById('gp_percent').value = '';
    document.getElementById('sale_price_2').value = '';
    
    calculateTable1();
    document.getElementById('product_name').focus();
}

function captureScreen() {
    const targetElement = document.getElementById('capture-area');
    const currentContainerBg = window.getComputedStyle(targetElement).backgroundColor;

    const modeBtn = document.getElementById('modeBtn');
    modeBtn.style.visibility = 'hidden';

    // เพิ่ม attribute พิเศษระบุหัวข้อลบ เพื่อสั่งไม่ให้ html2canvas วาดปุ่มลบลงไปในรูปภาพตอนกดเซฟ
    html2canvas(targetElement, {
        scale: 2, 
        backgroundColor: currentContainerBg, 
        useCORS: true,
        logging: false
    }).then(canvas => {
        modeBtn.style.visibility = 'visible';

        try {
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = 'ผลการคำนวณต้นทุนและกำไร.png';
                
                document.body.appendChild(downloadLink);
                downloadLink.click();
                
                setTimeout(() => {
                    document.body.removeChild(downloadLink);
                    URL.revokeObjectURL(url);
                }, 100);
            }, 'image/png');
        } catch (e) {
            const imageUri = canvas.toDataURL("image/png");
            const downloadLink = document.createElement('a');
            downloadLink.href = imageUri;
            downloadLink.download = 'ผลการคำนวณต้นทุนและกำไร.png';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    });
}
</script>

</body>
</html>
